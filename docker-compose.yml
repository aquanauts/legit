version: '3.8'

services:
  git-server:
    image: git-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: git-server
    restart: unless-stopped
    ports:
      # Map container port 22 to host port 2222 to avoid conflicts
      - "2222:22"
    volumes:
      # Persistent storage for git repositories
      - git-repos:/srv/git

      # Mount authorized_keys file (create this file first)
      # Option 1: Mount a local file (recommended for production)
      - ./authorized_keys:/home/git/.ssh/authorized_keys:ro

      # Persistent SSH host keys (avoids "host key changed" warnings)
      - ssh-host-keys:/etc/ssh/ssh_host_keys

      # Optional: Mount specific git hooks
      # - ./hooks/post-receive:/srv/git/myrepo.git/hooks/post-receive:ro
    environment:
      # Optional: Adjust git user UID/GID to match host user
      # This helps with permission management when accessing volumes
      # - GIT_USER_UID=1000
      # - GIT_USER_GID=1000

      # Optional: Fetch authorized_keys from a URL (e.g., GitHub)
      # This will override the mounted authorized_keys file
      # - SSH_AUTHORIZED_KEYS_URL=https://github.com/username.keys

      # Optional: Create symlink /home/git/repos -> /srv/git
      # Allows shorter clone URLs: git@host:/home/git/repos/myrepo.git
      - REPOSITORIES_HOME_LINK=true
    healthcheck:
      test: ["CMD", "pgrep", "sshd"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Named volume for git repositories
  git-repos:
    driver: local

  # Named volume for SSH host keys
  ssh-host-keys:
    driver: local

# Example: Using bind mounts instead of named volumes
# volumes:
#   git-repos:
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: /path/on/host/git-repos
#   ssh-host-keys:
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: /path/on/host/ssh-host-keys
